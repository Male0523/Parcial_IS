name: EnvíaYa test suite

on:
  push:
    branches:
      - docs/fase-2-plan-pruebas

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests and collect real outputs
        id: test-run
        shell: bash
        run: |
          mkdir -p evidencias
          set +e
          python -m pytest -q tests/ \
            --junitxml=evidencias/junit.xml \
            --cov=envios --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:evidencias/coverage.json \
            2>&1 | tee evidencias/pytest-coverage-output.txt
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > evidencias/pytest-exit-code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          out = ["# EnvíaYa: resumen de ejecución", "",
                 "Generado por el job de GitHub Actions a partir de los reportes de esta ejecución.", ""]
          junit = Path("evidencias/junit.xml")
          if junit.exists():
              root = ET.parse(junit).getroot()
              suites = list(root) if root.tag == "testsuites" else [root]
              totals = {key: sum(int(s.attrib.get(key, 0)) for s in suites)
                        for key in ("tests", "failures", "errors", "skipped")}
              out += [f"- Pruebas: {totals['tests']}",
                      f"- Fallidas: {totals['failures']}",
                      f"- Errores técnicos: {totals['errors']}",
                      f"- Omitidas: {totals['skipped']}"]
              failed = []
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  detail = failure if failure is not None else error
                  if detail is not None:
                      failed.append((case.attrib.get("name", "(sin nombre)"),
                                     detail.attrib.get("message", "").splitlines()[0]))
              out += ["", "## Casos fallidos o con error"]
              out += [f"- `{name}`: {message}" for name, message in failed] or ["- Ninguno."]
          else:
              out += ["- No se generó JUnit XML; revisar el log del job por error de entorno o configuración."]
          coverage = Path("evidencias/coverage.json")
          if coverage.exists():
              data = json.loads(coverage.read_text(encoding="utf-8"))
              totals = data["totals"]
              out += ["", "## Cobertura",
                      f"- Sentencias: {totals.get('percent_covered_display', totals.get('percent_covered'))}%",
                      f"- Ramas cubiertas: {totals.get('covered_branches', 0)} de {totals.get('num_branches', 0)}",
                      f"- Ramas no cubiertas: {totals.get('missing_branches', 0)}"]
              out += ["", "## Líneas no cubiertas"]
              files = data.get("files", {})
              missing = [(name, item.get("missing_lines", []))
                         for name, item in files.items() if item.get("missing_lines")]
              out += [f"- `{name}`: {', '.join(map(str, lines))}" for name, lines in missing] or ["- Ninguna."]
              out += ["", "## Ramas no cubiertas"]
              missing = [(name, item.get("missing_branches", []))
                         for name, item in files.items() if item.get("missing_branches")]
              out += [f"- `{name}`: {branches}" for name, branches in missing] or ["- Ninguna."]
          else:
              out += ["", "No se generó JSON de cobertura; revisar el log del job."]
          Path("evidencias/resumen.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enviaya-test-evidence-${{ github.run_id }}
          path: evidencias/
          if-no-files-found: warn
          retention-days: 90
      - name: Fail job when the test command failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.test-run.outputs.exit_code }}" != "0" ]; then
            echo "Pytest exited with status ${{ steps.test-run.outputs.exit_code }}."
            exit 1
          fi
